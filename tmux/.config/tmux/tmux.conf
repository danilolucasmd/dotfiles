set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# General
set -g detach-on-destroy off
set -sg escape-time 0
set -g base-index 1
set -g renumber-windows on
set -g status-position bottom

# Keybindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Vim mode
set-window-option -g mode-keys vi

## Navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

## Resize the current pane using Alt + direction
bind -n M-, resize-pane -L 5
bind -n M-. resize-pane -R 5
bind -n M-< resize-pane -U 5
bind -n M-> resize-pane -D 5

## Swap panes using Alt + Shift + HJKL without prefix
#### (commented out in favor of vim-tmux-navigator)
# bind -n M-H swap-pane -t '{left-of}'
# bind -n M-J swap-pane -t '{down-of}'
# bind -n M-K swap-pane -t '{up-of}'
# bind -n M-L swap-pane -t '{right-of}'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'maxpetretta/tmux-monokai-pro'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Plugins setup
## tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'

## tmux-continuum
set -g @continuum-restore 'on'

# TPM setup
## Automatic tpm installation
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
