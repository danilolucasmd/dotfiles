set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# General
set -g detach-on-destroy off
set -sg escape-time 0
set -g base-index 1
set -g renumber-windows on
set -g status-position bottom

## Notifications
set -g allow-passthrough on
set -g visual-activity on
set -g bell-action any
set -g visual-bell off

## Claude fixes
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Vim mode
set-window-option -g mode-keys vi
## Setup 'v' to begin selection, just like Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Keybindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Pane navigation via prefix + hjkl
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

## Resize the current pane using Alt + direction
bind -n M-, resize-pane -L 5
bind -n M-. resize-pane -R 5
bind -n M-< resize-pane -U 5
bind -n M-> resize-pane -D 5

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'maxpetretta/tmux-monokai-pro'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugins setup
## tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'

## tmux-continuum
set -g @continuum-restore 'on'

# TPM setup
## Automatic tpm installation
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Alt+hjkl pane navigation. When a vim-like program is focused, forward the key
# so nvim can move between its own splits (see nvim keymaps.lua); otherwise switch
# tmux panes. The 'if -F #{pane_at_*}' guard makes select-pane a no-op at an edge,
# so focus never wraps around.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' "if-shell -F '#{pane_at_left}'   '' 'select-pane -L'"
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' "if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' "if-shell -F '#{pane_at_top}'    '' 'select-pane -U'"
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' "if-shell -F '#{pane_at_right}'  '' 'select-pane -R'"

# Safety net: strip any Ctrl-hjkl bindings left over from a previously-loaded
# copy of vim-tmux-navigator. Must come after tpm.
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
