# Genral
set -sg escape-time 0
set -g base-index 1

# Kitty
set -g default-terminal "xterm-kitty"
set -ag terminal-overrides ",xterm-kitty:Tc"

# Keybindings
#### Resize the current pane using Alt + direction
bind -n M-, resize-pane -L 5
bind -n M-. resize-pane -R 5
bind -n M-< resize-pane -U 5
bind -n M-> resize-pane -D 5

#### Swap panes using Alt + Shift + HJKL without prefix
bind -n M-H swap-pane -t '{left-of}'
bind -n M-J swap-pane -t '{down-of}'
bind -n M-K swap-pane -t '{up-of}'
bind -n M-L swap-pane -t '{right-of}'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'maxpetretta/tmux-monokai-pro'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin commands
set -g @continuum-restore 'on'

# Automatic tpm installation
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
