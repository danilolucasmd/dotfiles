# yaml-language-server: $schema=https://raw.githubusercontent.com/razajamil/herdr-plugin-workspace-manager/main/schema.json
#
# herdr-plugin-workspace-manager — workspace template config.
#
# 1. AUTOMATIC templating for credit_card. The `workspaces:` mapping below
#    points ~/Code/credit_card at the "credit_card" layout, so whenever a NEW
#    LINKED WORKTREE of that repo is created (worktree.created fires), the
#    plugin applies the layout automatically. The main checkout is never
#    templated — only linked worktrees.
#
# 2. ON-DEMAND apply for anything else, via the built-in keybinding:
#
#        prefix+shift+l        (i.e. ctrl+b  then  shift+l)
#
#    That runs `apply` with no layout id, so the plugin resolves the layout
#    from the HERDR_WSM_LAYOUT env var. Export e.g. HERDR_WSM_LAYOUT=default in
#    your shell rc to make that keybinding apply the "default" layout below.
#
# Pane geometry:
#   split: vertical | right  -> panes side by side
#          horizontal | down -> panes stacked top/bottom
#   ratio: fraction of the split the PREVIOUS pane keeps (0 < r < 1).
#   The first pane of a tab is the root and is never split. The first tab
#   reuses the worktree's existing (already-open) tab.

workspaces:
  - repo: ~/Code/credit_card
    defaultLayout: credit_card

layouts:
  # Mirror of the live credit_card workspace: 4 tabs (agent / git / nvim /
  # server) with claude in the agent tab, lazygit and nvim in their own tabs,
  # and two shells side by side in the server tab.
  - id: credit_card
    tabs:
      - title: agent
        panes:
          - title: shell           # left pane, keeps 65% of the width
          - title: claude
            command: claude
            split: right           # side by side with the shell
            ratio: 0.65
      - title: git
        panes:
          - title: lazygit
            command: lazygit
      - title: nvim
        panes:
          - title: nvim
            command: nvim
      - title: server
        panes:
          - title: server
          - title: server
            split: right           # side by side, 50/50
            ratio: 0.5

  # On-demand default (applied by prefix+shift+l when HERDR_WSM_LAYOUT=default).
  - id: default
    tabs:
      - title: code
        panes:
          - title: agent
            command: claude
          - title: editor
            command: nvim
            split: vertical
      - title: git
        panes:
          - title: lazygit
            command: lazygit
