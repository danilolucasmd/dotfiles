onboarding = false
[theme]
name = "one-dark"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = false

# Move pane focus with Alt+hjkl (direct chords, no prefix), alongside the
# default prefix+hjkl. Ctrl+hjkl stays free for nvim/tmux inside panes.
[keys]
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
# In the prefix+w navigate surface, use j/k to move between workspaces (herdr's
# default is the arrow keys). j/k default to pane up/down there, so move pane
# up/down onto the freed arrow keys; h/l still move pane focus left/right.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

# Resize the focused pane's split with Alt+, and Alt+. (moves the shared split
# boundary left / right; herdr's default step is ~12 columns per press).
[[keys.command]]
key = "alt+comma"
type = "shell"
command = "herdr pane resize --direction left --current"
description = "Resize pane split left"

[[keys.command]]
key = "alt+period"
type = "shell"
command = "herdr pane resize --direction right --current"
description = "Resize pane split right"
