# Loads scripts/default-nodes/mru-default-node.lua, which is where the reasoning
# lives.
#
# The script is not next to this file. Configuration is found under
# XDG_CONFIG_HOME, but scripts are found under XDG_DATA_HOME, so the declaration
# lives in ~/.config/wireplumber/wireplumber.conf.d and the script it names lives
# in ~/.local/share/wireplumber/scripts. Put the script beside this file instead
# and wireplumber exits 78 with "Could not locate script", taking audio down with
# it until the path is fixed. Both trees are in the `wireplumber` stow package.
#
# `required` rather than `optional`: a silently skipped hook would look exactly
# like the bug it fixes, which is the kind of thing that takes an evening to find
# twice. The cost is that a typo here is fatal rather than quiet, which is the
# right trade for something that only ever changes by hand.
wireplumber.components = [
  {
    name = default-nodes/mru-default-node.lua, type = script/lua
    provides = hooks.default-nodes.find-mru
    requires = [ metadata.default ]
  }
]

wireplumber.profiles = {
  main = {
    hooks.default-nodes.find-mru = required
  }
}
