# Managed by dotfiles/install.sh -- see snapshots/README.md
#
# limine-snapper-sync watches snapper and keeps a "Snapshots" submenu in
# Limine in step with it, copying each snapshot's kernel and initramfs onto the
# ESP so a rollback boots the kernel that snapshot was taken with. That last
# part is the whole reason this tool is here rather than grub-btrfs: /boot IS
# the ESP on an archinstall layout, so kernels live outside every btrfs
# snapshot and something has to pair them back up.
#
# Only the values that differ from upstream's defaults are set. The shipped
# file at /usr/share/doc (or the package's own copy) documents the rest.

# Boot Partition Path
#
# Stated rather than left to auto-detection, because `snapshot` has to agree
# with this tool about where the ESP is and auto-detection would have them
# guessing separately. install.sh substitutes what `bootctl --print-esp-path`
# reports: /boot on an archinstall systemd-boot layout, /boot/efi on the GRUB
# one older versions of archinstall.md told you to pick.
ESP_PATH="@@ESP_PATH@@"


# Boot Partition Usage Limit
#
# archinstall's best-effort layout gives a 1 GiB ESP, and upstream recommends 4.
# 75 rather than the default 85 leaves headroom that restore itself needs --
# restoring copies kernel files in, and a boot partition with no free space
# blocks the restore rather than the snapshot, which is the worse moment to
# find out. install.sh drops `kms` from HOOKS on NVIDIA machines to make this
# budget workable at all; see snapshots/README.md for the arithmetic.
LIMIT_USAGE_PERCENT=75

# Max Snapshot Entries
#
# "auto" prunes the oldest entries against LIMIT_USAGE_PERCENT instead of
# against a count, which is the right trade on a small ESP: entries sharing a
# kernel are deduplicated by hash and cost nothing, so a fixed count would
# throw away free entries while a full partition still blocked new ones.
MAX_SNAPSHOT_ENTRIES=auto

# Exclude Entries from Snapshots
#
# There is no fallback preset on this system (see /etc/mkinitcpio.d/linux.preset,
# PRESETS=('default')), so this matches nothing today. It is set so that adding
# one later does not silently double every snapshot's cost on the ESP.
EXCLUDE_SNAPSHOT_ENTRIES="*fallback"

# Snapper Configuration Name
#
# Stated rather than auto-detected: only the root config produces bootable
# snapshots, and naming it skips a `snapper list-configs` on every event.
SNAPPER_CONFIG_NAME="root"

# Restore Method Selection
#
# "replace" creates a new subvolume from the chosen snapshot and swaps it in.
# It is fast, it works with the overlayfs writable layer that btrfs-overlayfs
# gives a read-only snapshot, and it does not need the openSUSE-style layout
# that the native "snapper" method requires -- which archinstall does not
# produce. The cost is a new subvolume ID and a lost parent relationship in the
# snapper list, neither of which matters for getting a broken machine back.
RESTORE_METHOD=replace

# Snapshot Name Format
#
# 8 is "2023-12-20 10:59:59 | description". The description is the point: every
# snapshot here is named, either by snap-pac with the pacman command line or by
# `snapshot` with whatever was about to happen. A menu of bare IDs and
# timestamps is unreadable at exactly the moment you need to read it.
SNAPSHOT_FORMAT_CHOICE=8

# Desktop Notifications
#
# Kept on. The failure this warns about is silent by design -- once the ESP is
# past LIMIT_USAGE_PERCENT, new snapshots simply stop getting boot entries and
# nothing about snapper's output changes.
ENABLE_NOTIFICATION=yes
