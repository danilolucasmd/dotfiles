# Managed by dotfiles/install.sh -- see snapshots/README.md
#
# TEMPLATE. install.sh substitutes @@CMDLINE@@ before writing this to
# /etc/limine-entry-tool.conf, because the kernel command line names a specific
# filesystem and these dotfiles run on more than one machine. Nothing
# machine-specific may be committed here.
#
# limine-entry-tool (shipped by limine-mkinitcpio-hook) owns the *normal* boot
# entries: it regenerates them whenever a kernel is installed or removed, which
# is what stops /boot/limine.conf from drifting the way a hand-written
# systemd-boot entry does. limine-snapper-sync owns the Snapshots submenu and
# is configured separately in /etc/limine-snapper-sync.conf.

# Boot partition path, as reported by `bootctl --print-esp-path` at install
# time. Kept in step with the same value in /etc/limine-snapper-sync.conf.
ESP_PATH="@@ESP_PATH@@"

# Kernel command line for the default entry.
#
# Derived at install time from the running system -- the filesystem UUID from
# `findmnt`, the root subvolume from the live mount options, and whatever else
# the running kernel was given, minus the bits the bootloader supplies itself.
# Note this is the array-append form: limine-entry-tool builds the rest of the
# entry (kernel path, initramfs, microcode) on its own.
KERNEL_CMDLINE[default]+=@@CMDLINE@@

# Verify boot files after writing them.
ENABLE_VERIFICATION=yes

# Order of the top-level boot menu.
#
# Normal entries first, fallback kernels next, Snapshots last. The snapshot
# menu is for the day something is broken; it should not be the thing you
# arrow past every other day.
BOOT_ORDER="*, *fallback, Snapshots"
ENABLE_SORT=no

# Also install Limine as the removable-media fallback (EFI/BOOT/BOOTX64.EFI).
#
# Cheap insurance: firmware that loses or reorders its NVRAM entries still
# finds a bootloader. This machine has nine stale Limine NVRAM entries from a
# previous install, which is a good demonstration that NVRAM is not a reliable
# place to keep the only pointer to your bootloader.
ENABLE_LIMINE_FALLBACK=yes

# Find and list other bootloaders (Windows, other distros) in the menu.
FIND_BOOTLOADERS=yes

# No unified kernel images. Plain vmlinuz + initramfs keeps each snapshot's
# boot files separable and hash-deduplicated by limine-snapper-sync; a UKI
# would bundle them into one blob per snapshot and cost far more on a 1 GiB ESP.
ENABLE_UKI=no
