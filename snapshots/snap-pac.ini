# Managed by dotfiles/install.sh -- see snapshots/README.md
#
# snap-pac ships alpm hooks that fire on every Install, Upgrade and Remove of
# any package. Because they are alpm hooks it does not matter who calls pacman:
# `pkg` (which shells out to pacman or yay), yay itself (every AUR build ends in
# a `pacman -U`), or pacman by hand all go through libalpm and all snapshot.
# That is why nothing in this repo wraps `pkg` -- a wrapper would only produce
# a second, worse-described snapshot beside the one already being taken.

[root]

# How many characters to limit the description for snapper.
#
# These descriptions become Limine boot entry labels. Longer than this and the
# entry wraps in the boot menu, which is exactly where legibility matters most.
desc_limit = 72

# Whether or not to take snapshots of this snapper configuration
snapshot = True

# What snapper cleanup algorithm to use
cleanup_algorithm = number

# Uncomment to add "important=yes" to userdata for snapshots referring to these
# packages.
#
# These are the transactions worth keeping longest, because they are the ones
# that break a boot rather than an application: the kernel itself, the DKMS
# graphics stack that has to match it, systemd, and the bootloader plumbing
# that puts snapshots in the menu in the first place. Marked snapshots are
# retained under NUMBER_LIMIT_IMPORTANT in snapper's config, so a run of
# routine `pkg install` does not age out the kernel upgrade from last week.
#
# Matching is by package name, so it holds however the transaction was started.
important_packages = ["linux", "linux-lts", "linux-zen", "linux-firmware", "systemd", "nvidia-open-dkms", "nvidia-dkms", "nvidia-utils", "mkinitcpio", "limine", "limine-mkinitcpio-hook", "limine-snapper-sync"]

# Uncomment to add "important=yes" to userdata for snapshots that were created
# with the following commands.
#
# Best effort only, and deliberately not the main lever: snap-pac compares the
# parent process's full command line for an *exact* string match, so this
# catches `pkg update` and a plain `sudo pacman -Syu` (both of which exec
# `pacman -Syu`) and misses yay, which builds a much longer argument list.
# important_packages above is what actually does the work.
important_commands = ["pacman -Syu", "pacman -Syyu"]

# Example for another snapper configuration named "home"
[home]

# A pacman transaction does not touch $HOME, so a home snapshot per transaction
# captures nothing while still counting against NUMBER_LIMIT -- it would crowd
# out the hourly timeline snapshots that are the entire reason home is
# snapshotted at all.
snapshot = False
