# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = JetBrains Mono Nerd Font

general {
    hide_cursor = false
}

# Fingerprint unlock, and only here.
#
# hyprlock talks to fprintd over DBus itself rather than through PAM, so this
# block reaches the lock screen and nothing else on the machine: sddm, sudo and
# login keep asking for the password alone. That is the point -- the screen that
# greets a cold boot stays a password screen, and only the one unlocked forty
# times a day gets the reader.
#
# Safe to leave on unconditionally. With no reader, no fprintd or no enrolled
# finger hyprlock logs that it could not reach the Fprint service and the field
# behaves exactly as it did before; the indicator label at the bottom of this
# file is what makes the difference visible.
auth {
    fingerprint {
        enabled = true
        # Three misses in a row disable fingerprint auth for the rest of the
        # lock -- hyprlock's own limit, not fprintd's -- so a short retry delay
        # costs nothing and makes a badly placed finger feel like one attempt
        # rather than spending a third of the budget.
        retry_delay = 250 # in milliseconds
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 2, linear
    animation = fadeOut, 1, 2, linear
    animation = inputFieldDots, 0, 0, 0
}

background {
    monitor =
    path = $ACTIVE_WALLPAPER_PATH
    blur_passes = 3
}

# TIME
label {
    monitor =
    # not $TIME: builtin vars only redraw when the text changes, so a redraw that
    # lands while the monitor is dpms-off is dropped and the clock stays stale
    # until the next minute rolls over. cmd[] labels always redraw; :true also
    # makes them respond to SIGUSR2 (see hypridle on-resume).
    text = cmd[update:1000:true] date +"%H:%M"
    color = rgb(dddddd)
    font_size = 90
    font_family = $font

    position = 0, 170
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000:true] date +"%A, %d %B"
    color = rgb(dddddd)
    font_size = 22
    font_family = $font

    position = 0, 88
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgb(dddddd)
    check_color = rgb(dddddd)
    fail_color = rgba(ff6633ee)

    font_color = rgb(dddddd)
    fade_on_empty = false
    rounding = 10

    font_family = $font
    placeholder_text = Enter Password
    # $FAIL and not $PAMFAIL: it carries whichever method just failed, so a
    # fingerprint that did not match says so instead of showing the stale (or
    # empty) message from the password path.
    fail_text = $FAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# FINGERPRINT INDICATOR
label {
    monitor =
    # Prints nothing at all when fingerprint unlock cannot happen, and a label
    # with empty text draws nothing -- so a machine with no reader, no fprintd
    # or no enrolled finger gets the plain password field above and no icon
    # promising something that will never fire. update:0 runs it once, at lock
    # time, which is the only moment the answer can change.
    text = cmd[update:0] ~/.config/hypr/scripts/fingerprint-icon.sh
    color = rgb(dddddd)
    font_size = 24
    # Not $font, and this is the whole reason the glyph was arriving with its
    # right edge sliced off. hyprlock sizes a label's texture to pango's
    # *logical* extents -- the advance width -- and in JetBrainsMono Nerd Font
    # this glyph is a 28px drawing in a 21px cell, so 7px of it fell outside
    # the texture. The symbols-only face draws it inside its advance (32px of
    # ink in a 35px cell at this size), which is what that face is for. Nothing
    # else on this screen wants it: it has no letters worth reading.
    font_family = Symbols Nerd Font Mono

    # Just outside the right edge of the input field. The field is 20% of the
    # monitor wide and centred, so its edge sits at 10% and a glyph centred at
    # 12% clears it by a little over its own half-width. Both are percentages
    # on purpose: a pixel offset would drift onto or away from the field the
    # moment this config met a monitor of another width.
    position = 12%, -20
    halign = center
    valign = center
}
