
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XMODIFIERS,@im=fcitx
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots
env = ACTIVE_WALLPAPER_PATH,$HOME/.config/wallpapers/Pablo Garcia Saldana.jpg

# Steam under Wayland on NVIDIA. These used to sit in a `steam` stow package at
# ~/.config/steam/env.conf, which nothing ever read -- Steam does not look
# there, so they had never taken effect. The session is the only place that can
# actually put them in the client's environment.
env = SDL_VIDEODRIVER,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = STEAM_FORCE_DESKTOPUI_SCALING,1

# Icon theme for the quickshell bar's system tray. Qt has no icon theme of its
# own here, so symbolic tray icons (fcitx5's keyboard) would render black on
# the dark bar or not at all; breeze-dark ships light variants built for it.
env = QS_ICON_THEME,breeze-dark

# 1Password's SSH agent. ~/.ssh/config already points OpenSSH at the socket
# with IdentityAgent, so `ssh` and `git` were fine without this -- but anything
# that looks for the agent the normal way (ssh-add, and any client that is not
# OpenSSH reading its config) found nothing, which is why the agent looked
# broken. Setting it here covers the whole session, GUI apps included.
env = SSH_AUTH_SOCK,$HOME/.1password/agent.sock

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# The real layout -- external as the main screen, laptop panel mirroring it --
# is applied by scripts/monitors.py (exec-once below). It cannot live here: a
# mirror rule has to name its source by connector, and a rule naming a monitor
# that is not plugged in leaves the panel mirroring nothing. Connectors are not
# even stable -- this line used to say HDMI-A-1, which is why it had quietly
# stopped applying and the monitor sat at 60Hz.
#
# These two are just the baseline the session starts from, before the daemon's
# first pass a moment later.
monitor = eDP-1, preferred, 0x0, 1.5
monitor = , preferred, auto, 1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = nautilus
$menu = walker

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = hyprpaper & firefox
exec-once = fcitx5 -d
# Authentication agent for polkit prompts (mounting disks in Nautilus, the
# Proton VPN helper, pika-backup). Without one running, anything that asks
# for privileges gets no dialog and simply fails.
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hypridle
exec-once = hyprpaper
exec-once = qs
exec-once = elephant
exec-once = walker --gapplication-service
# Remember the keyboard layout (alt+space) separately for each application
exec-once = ~/.config/hypr/scripts/kb-layout-per-app.py
# Re-apply the display layout on every monitor hotplug: see the MONITORS block.
exec-once = ~/.config/hypr/scripts/monitors.py

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 0

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(dddddd)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle

    # Prevents windows focus to cycle through windows after focusing an edge window
    no_focus_fallback = true
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  0,     1.21,  almostLinear, fade
    animation = workspacesOut, 0,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile option removed in Hyprland 0.55.x; pseudotiling is now a per-window
    # toggle via the `pseudo` dispatcher (bound to mainMod + P in the keybinds section below)
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(

    # Honour xdg-activation requests, so an app that asks to be raised actually
    # gets focus. Clicking a Brave notification works through this: Brave
    # focuses the window holding the tab that fired it, and without this
    # Hyprland drops the request. See quickshell's focus-sender.sh.
    focus_on_activate = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,us
    kb_variant = ,intl
    kb_model = pc105
    # No grp:alt_space_toggle: alt+space is a Hyprland bind now (see the
    # keyboard layout binds), so that holding alt after it can put
    # quickshell's layout picker up. xkb switched the group inside
    # libxkbcommon, where nothing could hang a panel off it.
    kb_options =
    kb_rules =

    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
# General
bindd = $mainMod, T, Open terminal, exec, $terminal
bindd = $mainMod, W, Close window, killactive,

# Launcher
bindd = $mainMod, SPACE, App launcher, exec, $menu
bindd = $mainMod, V, Clipboard history, exec, $menu --provider clipboard
bindd = $mainMod, E, Emoji picker, exec, $menu --provider symbols
# Claude Code usage panel. Quickshell owns the panel, so the bind only has to
# ask it to toggle; `qs ipc` finds the running instance on its own.
bindd = $mainMod, A, Claude usage panel, exec, qs ipc call agentUsage toggle
# Past notifications, in the same arrangement. Quickshell is the
# notification daemon itself now, so nothing else is involved.
bindd = $mainMod, N, Notification history, exec, qs ipc call notifications toggle
# Calendar panel, same arrangement.
bindd = $mainMod, C, Calendar panel, exec, qs ipc call calendar toggle
# Charge per pack, health, and the power profile. B was free.
bindd = $mainMod, B, Battery panel, exec, qs ipc call battery toggle
# Everything currently playing or paused, one row per player, with a transport
# on each. M was free.
bindd = $mainMod, M, Now playing panel, exec, qs ipc call media toggle
# Audio device pickers: output on O, input on I.
bindd = $mainMod, O, Audio output picker, exec, qs ipc call audio outputs
bindd = $mainMod, I, Audio input picker, exec, qs ipc call audio inputs
# Keyboard layout, on alt+space as it always was. Each press switches straight
# away; keep alt down and the picker appears after a moment, with every further
# space walking the list and wrapping at the end. Letting alt go puts it away —
# the layout under the tick is already live. kb-layout-per-app.py hears each
# switch as `activelayout` either way, so the choice is still remembered per
# window class.
bindd = ALT, space, Cycle keyboard layout, exec, qs ipc call keyboard cycle
# Nothing here for letting alt go: Hyprland dispatches keybinds when a modifier
# is pressed but never when it is released — measured on 0.56.2, with every
# modmask spelling and `bindri` too. The panel hears that itself, being the
# surface that holds the keyboard while it is up.

# Apps
bindd = $mainMod, Backslash, 1Password quick access, exec, 1password --quick-access

# Move focus with mainMod + hjkl
bindd = $mainMod, H, Focus window left, movefocus, l
bindd = $mainMod, L, Focus window right, movefocus, r
bindd = $mainMod, K, Focus window up, movefocus, u
bindd = $mainMod, J, Focus window down, movefocus, d

# Move active window with mainMode + SHIFT + hjkl
bindd = $mainMod SHIFT, H, Swap window left, swapwindow, l
bindd = $mainMod SHIFT, J, Swap window down, swapwindow, d
bindd = $mainMod SHIFT, K, Swap window up, swapwindow, u
bindd = $mainMod SHIFT, L, Swap window right, swapwindow, r

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, Switch to workspace 1, workspace, 1
bindd = $mainMod, 2, Switch to workspace 2, workspace, 2
bindd = $mainMod, 3, Switch to workspace 3, workspace, 3
bindd = $mainMod, 4, Switch to workspace 4, workspace, 4
bindd = $mainMod, 5, Switch to workspace 5, workspace, 5
bindd = $mainMod, 6, Switch to workspace 6, workspace, 6
bindd = $mainMod, 7, Switch to workspace 7, workspace, 7
bindd = $mainMod, 8, Switch to workspace 8, workspace, 8
bindd = $mainMod, 9, Switch to workspace 9, workspace, 9
bindd = $mainMod, 0, Switch to workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

# Resize active window
bindd = $mainMod, code:59, Shrink window width, resizeactive, -100 0    # < key
bindd = $mainMod, code:60, Grow window width, resizeactive, 100 0     # > key
bindd = $mainMod SHIFT, code:59, Shrink window height, resizeactive, 0 -100
bindd = $mainMod SHIFT, code:60, Grow window height, resizeactive, 0 100

# Move/resize windows with mainMod + LMB/RMB and dragging
binddm = $mainMod, mouse:272, Move window with mouse, movewindow
binddm = $mainMod, mouse:273, Resize window with mouse, resizewindow

# Toggle split
bindd = $mainMod, slash, Toggle split direction, layoutmsg, togglesplit

# Every keybind on the system, searchable. The list is built from `hyprctl
# binds -j` at open time, so it is the live bind table rather than a copy of
# this file — which is why every bind above is a `bindd` carrying its own
# description. super+? is super+shift+slash on this keyboard.
bindd = $mainMod SHIFT, slash, Show all keybinds, exec, ~/.config/hypr/scripts/keybinds-menu.py

# Toggle floating. Moved off super+O, which now opens the audio output picker.
bindd = $mainMod SHIFT CTRL, F, Toggle floating, togglefloating

# Toggle fullscreen
bindd = $mainMod, F, Maximize window, fullscreen, 1
bindd = $mainMod SHIFT, F, Fullscreen window, fullscreen, 0

# Cycle apps
bindd = ALT, Tab, Cycle windows, cyclenext, bringactivetotop

# Lock screen
bindd = $mainMod, Escape, Lock screen, exec, hyprlock

# Screenshots
bindd = $mainMod, S, Screenshot region, exec, hyprshot -m region
bindd = $mainMod CTRL, S, Screenshot region to clipboard, exec, hyprshot -m region --clipboard-only

# Screen record
bindd = $mainMod, R, Screen record, exec, ~/.config/scripts/screen-record.sh

# Color picker
bindd = $mainMod, P, Color picker, exec, hyprpicker --autocopy --format=hex --lowercase-hex

# Audio controls
binddel = ,XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binddel = SHIFT, XF86AudioRaiseVolume, Volume up with sound, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && \
  paplay ~/.config/sounds/volume-change.oga
binddel = ,XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binddel = SHIFT, XF86AudioLowerVolume, Volume down with sound, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && \
  paplay ~/.config/sounds/volume-change.oga
#### Bind AudioMute button to mic mute (keyboard knob click)
bindd = ,XF86AudioMute, Toggle microphone mute, exec, ~/.config/sounds/scripts/toggle-mic.sh

# Brightness controls
binddel = ,XF86MonBrightnessUp, Brightness up, exec, brightnessctl -e4 -n2 set 5%+
binddel = ,XF86MonBrightnessDown, Brightness down, exec, brightnessctl -e4 -n2 set 5%-

# Playback controls
binddl = , XF86AudioNext, Next track, exec, playerctl next
binddl = , XF86AudioPause, Play/pause, exec, playerctl play-pause
binddl = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
binddl = , XF86AudioPrev, Previous track, exec, playerctl previous
# Shift on the play key opens the now-playing panel instead of toggling. The
# plain binds above still fire on their own: Hyprland matches the modmask
# exactly, so holding shift is not also a bare play/pause. Both spellings are
# covered because keyboards disagree about which one the play key sends.
# Deliberately `bind` and not `bindl` — the transport keys are worth having on
# the lock screen, a panel is not.
bindd = SHIFT, XF86AudioPlay, Now playing panel, exec, qs ipc call media toggle
bindd = SHIFT, XF86AudioPause, Now playing panel, exec, qs ipc call media toggle

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class .*, suppress_event maximize

# Only let the browser pull focus to its workspace on activation (e.g. clicking a link).
# Keeps terminals/Claude from stealing focus when they request activation.
windowrule = match:class ^(brave-browser)$, focus_on_activate on

# Fix some dragging issues with XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on

# Always create new split to the right
dwindle {
  force_split = 2
}

#################
### Apparence ###
#################

# Theme
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3-dark"   # for GTK3 apps
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps# Theme

