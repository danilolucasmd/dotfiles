general {
    lock_cmd = hyprlock
    before_sleep_cmd = hyprlock
}

listener {
    timeout = 300
    on-timeout = hyprlock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    # SIGUSR2 makes hyprlock force-refresh its update:...:true labels, so the
    # first frame after wake already shows the right time instead of the
    # pre-sleep one.
    on-resume = hyprctl dispatch dpms on; pkill -USR2 hyprlock
}

# Suspend, but only on battery -- on the adapter the machine stays up however
# long it idles. hypridle has no conditionals of its own, so the script is the
# one that looks at the power supply. 600s is measured from the last activity,
# not from the blank above: ~4.5 minutes of dark screen before it drops off.
listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/lid.sh idle
}
