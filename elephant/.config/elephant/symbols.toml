# Return copies the emoji and pastes it into whatever was focused before the
# picker opened. elephant's default is a bare `wl-copy`, which stopped at the
# clipboard; see the script for why the paste cannot fire immediately.
command = "~/.config/scripts/copy-and-paste.sh"
history = true
history_when_empty = true
locale = 'en'

[Config]
hide_from_providerlist = false
icon = 'face-smile'
min_score = 50
name_pretty = ''
