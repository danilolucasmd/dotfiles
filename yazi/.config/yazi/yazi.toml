# Overrides only. Yazi merges this file over the preset compiled into the
# binary, so anything not set here tracks upstream on every update. This file
# used to be a full copy of an older preset, and once yazi renamed the keys it
# carried (`micro_workers`, fetcher `id`, `copy dirname`, `forward --far`...)
# every launch opened on a config error. keymap.toml and theme.toml were the
# same kind of verbatim copy with nothing changed, so they are gone outright.

# Replaces the preset's `play`, which is `xdg-open %s1`: that hands over only
# the first selected file, where mpv takes the whole selection as a playlist.
# Orphaned so quitting yazi does not take the player down with it.
[opener]
play = [
	{ run = "mpv --force-window --player-operation-mode=pseudo-gui -- %s", orphan = true, desc = "mpv", for = "unix" },
	{ run = "xdg-open %s1", orphan = true, desc = "Default app", for = "linux" },
]
# Images open in tensaku, the screenshot annotator (tensaku/), so Enter on a
# picture lands straight in an editor that can mark it up and put it back on
# the clipboard. Only from here: the system default for images stays
# qutebrowser. The default app is the second choice in yazi's open-with menu.
annotate = [
	{ run = "tensaku %s1", orphan = true, desc = "tensaku", for = "unix" },
]

# SVG is a vector image tensaku cannot draw on, so it keeps the default app.
[open]
prepend_rules = [
	{ mime = "image/svg+xml", use = [ "open", "reveal" ] },
	{ mime = "image/*", use = [ "annotate", "open", "reveal" ] },
]

# Newest first, with folders and files interleaved by date rather than every
# folder pinned above every file. btime (creation) rather than mtime, because a
# directory's mtime moves whenever anything inside it changes, which would keep
# floating old folders back to the top. reverse because yazi sorts ascending.
[mgr]
sort_by        = "btime"
sort_reverse   = true
sort_dir_first = false
