"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

# Overrides only. Yazi merges this file over the preset compiled into the
# binary, so anything not set here tracks upstream on every update. This file
# used to be a full copy of an older preset, and once yazi renamed the keys it
# carried (`micro_workers`, fetcher `id`, `copy dirname`, `forward --far`...)
# every launch opened on a config error. keymap.toml and theme.toml were the
# same kind of verbatim copy with nothing changed, so they are gone outright.

# Replaces the preset's `play`, which is `xdg-open %s1`: that hands over only
# the first selected file, where mpv takes the whole selection as a playlist.
# Orphaned so quitting yazi does not take the player down with it.
[opener]
play = [
	{ run = "mpv --force-window --player-operation-mode=pseudo-gui -- %s", orphan = true, desc = "mpv", for = "unix" },
	{ run = "xdg-open %s1", orphan = true, desc = "Default app", for = "linux" },
]
