# Nautilus and GTK file-dialog preferences, applied by install.sh with
# `dconf load /`. dconf is a single binary database rather than a config file,
# so this is the one thing in the repo that a stow symlink cannot carry: the
# keyfile is the source of truth and has to be re-dumped by hand when a
# preference changes. nautilus/README.md has the command.
#
# `dconf load` merges -- it writes the keys named here and leaves every other
# key in the database alone -- which is why loading at `/` is safe.
#
# Only keys that actually differ from the GSettings schema defaults live here,
# so the file reads as a list of decisions rather than a dump. Three things are
# deliberately left out:
#
#   - [org/gnome/nautilus/window-state], which is window geometry and belongs
#     to whichever monitor this machine happens to have.
#   - `migrated-gtk-settings`, a one-shot flag Nautilus sets after importing
#     the old GTK file-chooser settings once.
#   - [org/gnome/nautilus/list-view] default-column-order. It differs from the
#     schema default, but not because anyone reordered anything: the stored
#     list still names `detailed_type` and is missing `starred`, `where` and
#     `mime_type`, so it was written by an older Nautilus and never refreshed.
#     Pinning it would carry that staleness onto a fresh install and quietly
#     drop the newer columns out of the column menu's ordering.

[org/gnome/nautilus/preferences]
# Folders open as a list, not a grid of icons. This is the per-folder default;
# a folder Nautilus has been told about individually overrides it and that
# override lives in metadata, not here.
default-folder-viewer='list-view'

# The GTK Open/Save dialogs. These are not Nautilus -- they are drawn by GTK
# inside whichever app is saving -- but they share the sidebar bookmarks from
# ~/.config/gtk-3.0/bookmarks that this package stows, so the two are set up
# together and are easy to mistake for each other.
#
# GTK 3 and GTK 4 read the same schema from two different dconf paths, so a
# preference has to be written twice to hold everywhere. The two paths below
# are deliberately not identical: this machine only ever had the sort keys set
# under the GTK 3 path, and they are reproduced as they are rather than
# harmonised, because GTK writes them on its own the moment a column header is
# clicked in a dialog. If GTK 4 dialogs should also open sorted by date, copy
# the two sort keys into the gtk4 group.
[org/gtk/settings/file-chooser]
show-hidden=true
sort-column='modified'
sort-order='descending'

[org/gtk/gtk4/settings/file-chooser]
show-hidden=true
